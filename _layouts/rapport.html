---
layout: default
---
<div class="article-head">
  <div class="meta-row">
    <span class="badge">{{ page.type }}</span>
    <span class="date">{{ page.date | date: "%A %d %B %Y" }}</span>
  </div>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="sub">{{ page.subtitle }}</p>{% endif %}
</div>
<article>
  {{ content }}
</article>
