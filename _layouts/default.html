<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f6f1e7;
      --surface: #fffdf7;
      --ink: #211c14;
      --ink-soft: #463f33;
      --muted: #8b8171;
      --line: rgba(33,28,20,0.13);
      --line-soft: rgba(33,28,20,0.07);
      --accent: #b06a1c;
      --accent-bg: #f6e8cf;
      --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
      --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    body.type-soir {
      --accent: #3f45a8;
      --accent-bg: #e4e4f5;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* ---------- Header ---------- */
    .site-head {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 24px 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 19px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .brand:hover { text-decoration: none; }
    .brand .dot { color: var(--accent); }
    .head-link {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ---------- Layout ---------- */
    main { max-width: 760px; margin: 0 auto; padding: 0 24px 80px; }
    footer {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 24px 56px;
      border-top: 1px solid var(--line-soft);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.02em;
    }
    footer a { color: var(--muted); }

    /* ---------- Badge ---------- */
    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--accent-bg);
      color: var(--accent);
      white-space: nowrap;
    }

    /* ---------- Home hero ---------- */
    .hero { padding: 64px 0 40px; }
    .hero .kicker {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 16px;
    }
    .hero h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(40px, 8vw, 64px);
      line-height: 1.02;
      letter-spacing: -0.025em;
      margin: 0 0 20px;
    }
    .hero h1 em { font-style: italic; color: var(--accent); }
    .hero p.lede {
      font-size: 18px;
      line-height: 1.6;
      color: var(--ink-soft);
      max-width: 34em;
      margin: 0;
    }

    /* ---------- Archive list ---------- */
    .archive { margin-top: 8px; }
    .archive .group-label {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 40px 0 12px;
    }
    .entry {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      margin-bottom: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }
    .entry:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(33,28,20,0.06);
      text-decoration: none;
    }
    .entry .date {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      min-width: 96px;
    }
    .entry .title {
      flex: 1;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 19px;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .entry .arrow {
      font-family: var(--mono);
      color: var(--ink-soft);
      transition: transform 0.12s ease, color 0.12s ease;
    }
    .entry:hover .arrow { transform: translateX(3px); color: var(--accent); }

    /* ---------- Article ---------- */
    .article-head { padding: 56px 0 28px; }
    .article-head .meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .article-head .date {
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .article-head h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(34px, 6.5vw, 52px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
    }
    .article-head .sub {
      color: var(--ink-soft);
      font-size: 17px;
      margin: 0;
    }

    article { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 40px 44px; }
    article h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: -0.015em;
      margin: 44px 0 16px;
      padding-top: 4px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    article h2:first-child { margin-top: 0; }
    article h2::before {
      content: "";
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 3px;
      background: var(--accent);
      flex-shrink: 0;
      transform: translateY(-1px);
    }
    article h3 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 20px;
      margin: 28px 0 10px;
    }
    article p { margin: 0 0 14px; }
    article p:last-child { margin-bottom: 0; }
    article ul, article ol { margin: 0 0 14px; padding-left: 0; list-style: none; }
    article li {
      position: relative;
      padding: 5px 0 5px 26px;
      color: var(--ink-soft);
    }
    article li::before {
      content: "—";
      position: absolute;
      left: 4px;
      color: var(--accent);
      font-family: var(--serif);
    }
    article li strong { color: var(--ink); }
    article blockquote {
      margin: 0 0 16px;
      padding: 14px 18px;
      border-left: 3px solid var(--accent);
      background: var(--accent-bg);
      border-radius: 0 10px 10px 0;
      color: var(--ink-soft);
      font-size: 15px;
    }
    article blockquote p { margin: 0; }
    article hr { border: none; border-top: 1px solid var(--line-soft); margin: 32px 0; }
    article code {
      font-family: var(--mono);
      font-size: 0.9em;
      background: rgba(33,28,20,0.05);
      padding: 2px 6px;
      border-radius: 5px;
    }
    .accent-rule {
      height: 4px;
      width: 56px;
      background: var(--accent);
      border-radius: 2px;
      margin: 8px 0 0;
    }

    @media (max-width: 600px) {
      article { padding: 28px 22px; border-radius: 14px; }
      .entry { padding: 14px 16px; }
      .entry .date { min-width: 0; font-size: 12px; }
      .site-head { padding: 20px 20px 0; }
      main { padding: 0 20px 64px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .entry, .entry:hover { transition: none; transform: none; }
    }
  </style>
</head>
<body class="type-{{ page.type | default: 'matin' }}">
  <header class="site-head">
    <a class="brand" href="{{ '/' | relative_url }}">Théon<span class="dot">.</span>Rapports</a>
    <a class="head-link" href="{{ '/' | relative_url }}">Journal</a>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    Généré automatiquement par le second cerveau <a href="{{ '/' | relative_url }}">Théon</a> — {{ site.time | date: "%Y" }}
  </footer>
</body>
</html>
