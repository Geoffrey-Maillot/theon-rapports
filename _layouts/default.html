<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4efe6;
      --surface: #fffdf8;
      --ink: #221d15;
      --ink-soft: #4a4236;
      --muted: #8d8372;
      --line: rgba(34,29,21,0.13);
      --line-soft: rgba(34,29,21,0.07);
      --accent: #c07a1f;
      --accent-2: #e9a13b;
      --accent-bg: #f8ecd6;
      --accent-grad: linear-gradient(135deg, #f8ecd6 0%, #f6e2bd 100%);
      --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
      --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
      --shadow-sm: 0 1px 2px rgba(34,29,21,0.05), 0 3px 8px rgba(34,29,21,0.04);
      --shadow-md: 0 2px 4px rgba(34,29,21,0.05), 0 10px 26px rgba(34,29,21,0.07);
    }
    body.type-soir {
      --accent: #3d43a6;
      --accent-2: #6a70d6;
      --accent-bg: #e7e6f8;
      --accent-grad: linear-gradient(135deg, #e7e6f8 0%, #d9d8f3 100%);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* ---------- Header ---------- */
    .site-head {
      max-width: 780px;
      margin: 0 auto;
      padding: 26px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 20px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .brand:hover { text-decoration: none; }
    .brand .dot { color: var(--accent); }
    .head-link {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .head-link:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

    /* ---------- Layout ---------- */
    main { max-width: 780px; margin: 0 auto; padding: 0 24px 80px; }
    footer {
      max-width: 780px;
      margin: 0 auto;
      padding: 24px 24px 56px;
      border-top: 1px solid var(--line-soft);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.02em;
    }
    footer a { color: var(--muted); }

    /* ---------- Badge ---------- */
    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-bg);
      color: var(--accent);
      white-space: nowrap;
    }

    /* ---------- Home hero ---------- */
    .hero { padding: 72px 0 44px; position: relative; }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 180px;
      background: var(--accent-grad);
      opacity: 0.5;
      z-index: -1;
      border-radius: 0 0 40px 40px;
    }
    .hero .kicker {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 16px;
    }
    .hero h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(40px, 8vw, 66px);
      line-height: 1.0;
      letter-spacing: -0.025em;
      margin: 0 0 20px;
    }
    .hero h1 em { font-style: italic; color: var(--accent); }
    .hero p.lede {
      font-size: 18px;
      line-height: 1.6;
      color: var(--ink-soft);
      max-width: 36em;
      margin: 0;
    }
    .accent-rule {
      height: 4px;
      width: 60px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 2px;
      margin: 24px 0 0;
    }

    /* ---------- Archive list ---------- */
    .archive { margin-top: 8px; }
    .archive .group-label {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 40px 0 12px;
    }
    .entry {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      margin-bottom: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
    }
    .entry:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
      text-decoration: none;
    }
    .entry .title {
      flex: 1;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 19px;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .entry .arrow {
      font-family: var(--mono);
      color: var(--ink-soft);
      transition: transform 0.14s ease, color 0.14s ease;
    }
    .entry:hover .arrow { transform: translateX(3px); color: var(--accent); }

    /* ---------- Article ---------- */
    .article-head { padding: 60px 0 30px; }
    .article-head .meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .article-head .date {
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .article-head h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(34px, 6.5vw, 54px);
      line-height: 1.02;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
    }
    .article-head .sub {
      color: var(--ink-soft);
      font-size: 17px;
      margin: 0;
    }

    article { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 44px 48px; box-shadow: var(--shadow-sm); }

    /* Section headers */
    article h2 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: -0.015em;
      margin: 48px 0 18px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--accent-bg);
      border-radius: 12px;
    }
    article h2:first-child { margin-top: 0; }
    article h2 .ico {
      width: 34px; height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: var(--surface);
      border-radius: 9px;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }
    article h3 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 20px;
      margin: 28px 0 10px;
    }
    article p { margin: 0 0 14px; color: var(--ink-soft); }
    article p:last-child { margin-bottom: 0; }
    article strong { color: var(--ink); font-weight: 600; }
    article em { color: var(--accent); font-style: italic; }

    /* Lists */
    article ul, article ol { margin: 0 0 16px; padding-left: 0; list-style: none; }
    article li {
      position: relative;
      padding: 4px 0 4px 24px;
      color: var(--ink-soft);
    }
    article li::before {
      content: "—";
      position: absolute;
      left: 2px;
      color: var(--accent-2);
      font-family: var(--serif);
    }

    /* Task lists (kramdown) */
    article ul.task-list { list-style: none; padding: 0; }
    article li.task-list-item { padding: 0; }
    article li.task-list-item::before { content: none; }
    article ul.task-list ul.task-list { margin: 8px 0 4px 26px; padding-left: 14px; border-left: 2px solid var(--line-soft); }
    article .task-list-item {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 7px 12px;
      margin-bottom: 4px;
      border-radius: 9px;
      transition: background 0.12s ease;
    }
    article .task-list-item:hover { background: rgba(34,29,21,0.035); }
    article .task-list-item-checkbox {
      margin-top: 4px;
      width: 16px; height: 16px;
      accent-color: var(--accent);
      flex-shrink: 0;
      cursor: default;
    }
    /* important task = bold name */
    article li.task-list-item:has(> strong) {
      background: var(--accent-bg);
      padding-left: 12px;
    }
    article li.task-list-item:has(> strong)::before {
      content: "";
      position: absolute;
      left: 0; top: 8px; bottom: 8px;
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
    }
    article li.task-list-item del {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }
    /* date/rappel chips */
    article .task-list-item code {
      font-family: var(--mono);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink-soft);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Weather */
    .weather {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin: 4px 0 8px;
    }
    .wx {
      background: var(--accent-grad);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 20px;
    }
    .wx-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .wx-city { font-family: var(--serif); font-weight: 600; font-size: 17px; color: var(--ink); }
    .wx-emoji { font-size: 24px; }
    .wx-halves { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .wx-half { display: flex; flex-direction: column; min-width: 0; }
    .wx-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .wx-t { font-family: var(--serif); font-weight: 500; font-size: 34px; line-height: 1; letter-spacing: -0.02em; color: var(--ink); }
    .wx-w { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }

    /* Events (Calendar widget style) */
    .evts { margin: 4px 0 8px; }
    .evt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      margin-bottom: 6px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--c) 10%, var(--surface));
      border-left: 4px solid var(--c);
    }
    .evt-time { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); min-width: 78px; flex-shrink: 0; }
    .evt-title { flex: 1; font-weight: 600; font-size: 15px; color: var(--ink); }
    .evt-cal { font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .evt.ongoing {
      background: color-mix(in srgb, var(--c) 22%, var(--surface));
      box-shadow: inset 0 0 0 1.5px var(--c);
    }
    .evt-badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--c);
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .day-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }

    /* Tabs (per-agenda) */
    .tabs { margin: 4px 0 8px; }
    .tab-bar { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; }
    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }
    .tab-btn:hover { border-color: var(--c); }
    .tab-btn.active { background: var(--c); border-color: var(--c); color: var(--fg, #fff); }
    .tab-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
    .tab-btn.active .tab-dot { background: var(--fg, #fff); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    article blockquote {
      margin: 0 0 16px;
      padding: 14px 18px;
      border-left: 3px solid var(--accent);
      background: var(--accent-bg);
      border-radius: 0 10px 10px 0;
      color: var(--ink-soft);
      font-size: 15px;
    }
    article blockquote p { margin: 0; color: var(--ink-soft); }
    article hr { border: none; border-top: 1px solid var(--line-soft); margin: 32px 0; }
    article code {
      font-family: var(--mono);
      font-size: 0.9em;
      background: rgba(34,29,21,0.06);
      padding: 2px 6px;
      border-radius: 5px;
    }

    @media (max-width: 600px) {
      article { padding: 28px 20px; border-radius: 16px; }
      .entry { padding: 14px 16px; }
      .site-head { padding: 20px 20px 0; }
      main { padding: 0 20px 64px; }
      .weather { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .entry, .entry:hover { transition: none; transform: none; }
    }
  </style>
</head>
<body class="type-{{ page.type | default: 'matin' }}">
  <header class="site-head">
    <a class="brand" href="{{ '/' | relative_url }}">Théon<span class="dot">.</span>Rapports</a>
    <a class="head-link" href="{{ '/' | relative_url }}">Journal</a>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    Généré automatiquement par le second cerveau <a href="{{ '/' | relative_url }}">Théon</a> — {{ site.time | date: "%Y" }}
  </footer>
  <script>
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var wrap = btn.closest('.tabs');
        wrap.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
        wrap.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
        btn.classList.add('active');
        var panel = document.getElementById('tab-' + btn.getAttribute('data-tab'));
        if (panel) panel.classList.add('active');
      });
    });
  </script>
</body>
</html>
