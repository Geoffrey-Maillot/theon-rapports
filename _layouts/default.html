<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem; line-height: 1.6; color: #1a1a1a; background: #fafafa; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { border-bottom: 1px solid #e5e5e5; margin-bottom: 2rem; padding-bottom: 1rem; }
    h1 { margin: 0 0 .25rem; }
    .muted { color: #666; font-size: .9rem; }
    article { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 1.5rem 2rem; }
    article h2 { margin-top: 1.5rem; }
    .badge { display: inline-block; font-size: .75rem; padding: .15rem .55rem; border-radius: 999px; font-weight: 600; }
    .badge.matin { background: #fef3c7; color: #92400e; }
    .badge.soir { background: #dbeafe; color: #1e40af; }
    ul.posts { list-style: none; padding: 0; }
    ul.posts li { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: .8rem 1rem; margin-bottom: .5rem; }
  </style>
</head>
<body>
  <header>
    <h1>{{ site.title }}</h1>
    <div class="muted">{{ site.description }}</div>
  </header>
  {{ content }}
</body>
</html>
